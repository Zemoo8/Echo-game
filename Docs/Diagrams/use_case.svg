<text x="32" y="42" font-size="26" text-anchor="start" fill="#1E293B" font-weight="bold">ECHO · Use case diagram</text>
<text x="32" y="68" font-size="14.5" text-anchor="start" fill="#64748B">What the player can do, and what the GamePix platform does (diagramme de cas d'utilisation)</text>
